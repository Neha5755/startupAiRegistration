<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09231e" />
    <title>StartupReady AI | Founder registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="side-panel" aria-label="Registration overview">
        <a class="brand" href="#"><span class="brand-mark">S</span><span>startup<span>ready</span></span></a>
        <div class="side-copy">
          <p class="eyebrow">Founder onboarding</p>
          <h1>Turn your idea into <em>momentum.</em></h1>
          <p>Tell us the essentials. We’ll help shape the rest as your startup grows.</p>
        </div>
        <div class="steps" id="steps" aria-label="Registration steps"></div>
        <div class="side-footer"><span class="secure-dot"></span> Your information is kept private</div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div class="progress-wrap"><div class="progress-label"><span id="step-meta">Getting started</span><span id="percent">0%</span></div><div class="progress-track"><div id="progress-bar"></div></div></div>
          <div class="header-actions"><span id="save-status" class="save-status">Saved locally</span><button class="icon-button" id="theme-toggle" aria-label="Toggle color theme">◐</button><button class="text-button" id="save-exit">Save & exit</button></div>
        </header>
        <div class="form-stage" id="form-stage"></div>
        <footer class="form-nav" id="form-nav"></footer>
      </section>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
